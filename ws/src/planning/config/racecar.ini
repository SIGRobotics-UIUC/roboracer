# TUM global_racetrajectory_optimization parameters for the AutoDRIVE RoboRacer (1/10 scale), mintime only.
# Same layout as TUM's params/racecar.ini; read by planning/tum_mintime.py. Values are JSON.
#
# Sources:
#   [repo]  measured in this repo / docs/pipeline.md (wheelbase, steering, wheel radius)
#   [guide] AutoDRIVE RoboRacer Sim Racing technical guide 2024, vehicle parameters table
#           https://autodrive-ecosystem.github.io/competitions/roboracer-sim-racing-guide-2024/
#   [gym]   f1tenth_gym default vehicle parameters (real F1TENTH car)
#   [est]   estimate, tune in sim
# ----------------------------------------------------------------------------------------------------------------------
[GENERAL_OPTIONS]

### stepsize options [m]
# stepsize_prep:               linear interpolation before spline approximation
# stepsize_reg:                spline interpolation after spline approximation (= discretization of the optimization)
# stepsize_interp_after_opt:   spline interpolation of the exported raceline

stepsize_opts={"stepsize_prep": 0.05,
               "stepsize_reg": 0.2,
               "stepsize_interp_after_opt": 0.1}

### spline regression smooth options
# k_reg:                        [-] order of B-Splines
# s_reg:                        [-] smoothing factor (scipy splprep s; sum of squared residuals in m^2 over the
#                               stepsize_prep points: 1.0 on a ~30 m track ~ 4 cm rms deviation)

reg_smooth_opts={"k_reg": 3,
                 "s_reg": 1.0}

### preview and review distances for numerical curvature calculation [m] (scaled from TUM's 2.0/1.0 for a 1/10 car)

curv_calc_opts = {"d_preview_curv": 0.4,
                  "d_review_curv": 0.4,
                  "d_preview_head": 0.2,
                  "d_review_head": 0.2}

### general vehicle parameters
# v_max:        [m/s] [est] cap; sim top speed is 22.88 m/s [guide], far beyond what fits these tracks
# length:       [m] 0.50 [guide]
# width:        [m] 0.27 [guide] (car width; 0.236 m is the track width)
# mass:         [kg] 3.906 [guide]
# dragcoeff:    [kg*m2/m3] 0.5 * rho_air * c_w * A = 0.5 * 1.225 * 0.6 * 0.04 [est]
# curvlim:      [rad/m] tan(0.524) / 0.33 [repo] (not used by mintime, kept for TUM's checks)
# g:            [N/kg]

veh_params = {"v_max": 10.0,
              "length": 0.50,
              "width": 0.27,
              "mass": 3.906,
              "dragcoeff": 0.015,
              "curvlim": 1.75,
              "g": 9.81}

vel_calc_opts = {"dyn_model_exp": 1.0,
                 "vel_profile_conv_filt_window": null}

# ----------------------------------------------------------------------------------------------------------------------
[OPTIMIZATION_OPTIONS]

### minimum lap time optimization options
# width_opt:       [m] vehicle width incl. safety margin: 0.27 car + 2 x 0.115 m. The raceline centre stays
#                  width_opt / 2 = 0.25 m from the walls (measured ~0.04 m less). Corridors are narrow, so this is
#                  the main knob. Tightest in sim where a launch merges from the start pose (1.15 m off the line)
#                  into iros2026's first bend (s ~8 m): base_link 0.14-0.16 m from the wall and 0.07-0.10 m inside
#                  the line (pure pursuit's cut there, estimated ~0.13 m); flying laps >= 0.20 m (map frame).
# penalty_delta:   [-] smoothness penalty on steering changes (TUM default 10)
# penalty_F:       [-] smoothness penalty on force changes (TUM default 0.01). 1.0: at 0.01 the speed plan
#                  switched straight from full drive to full brake (sim: "slamming gas and brake")
# mue:             [-] friction coefficient [guide]: tire friction curve extremum 0.72 longitudinal,
#                  1.00 lateral -> 0.7 conservative, tune in sim
# safe_traj:       acceleration ellipse (ax / ax_safe)^2 + (ay / ay_safe)^2 <= 1 at every point. Explicit values
#                  need no ggv diagram (only nulls are filled from one). Without it Porto planned ax -5.6 .. +6.2
#                  m/s^2, faster than the adapter's speed ramp (max_acceleration 2.5 m/s^2) can follow.
#   ax_pos_safe:   [m/s^2] = adapter.yaml max_acceleration
#   ax_neg_safe:   [m/s^2] braking, < mue * g
#   ay_safe:       [m/s^2] lateral; Porto peaked at 7.3 without it
# scaling:         our patch to opt_mintime.py (docker/tum_mintime.patch). Upstream hard-codes NLP scaling for a
#                  1200 kg car (v 50 m/s, forces 7500-20000 N, n 5 m) and caps the yaw rate at pi/2 rad/s, which a
#                  1/10 car exceeds in every corner (v / R ~ 3 m/s / 0.8 m). Values ~ the expected magnitudes:
#   v_s, omega_z_s, n_s, f_drive_s, f_brake_s, gamma_y_s:  state / control scaling [m/s, rad/s, m, N, N, N]
#   omega_z_max:   [rad/s] yaw rate bound
#   v_guess:       [m/s] initial guess for the speed
#   f_prod_max:    [N^2] tolerance of the f_drive * f_brake = 0 constraint (upstream 20000 N^2)
#   f_reg_s:       [N] force normalization in the penalty_F term (upstream 10000 N)

optim_opts_mintime={"width_opt": 0.50,
                    "penalty_delta": 10.0,
                    "penalty_F": 1.0,
                    "mue": 0.7,
                    "n_gauss": 5,
                    "dn": 0.25,
                    "limit_energy": false,
                    "energy_limit": 2.0,
                    "safe_traj": true,
                    "ax_pos_safe": 2.5,
                    "ax_neg_safe": -3.5,
                    "ay_safe": 7.0,
                    "w_tr_reopt": 2.0,
                    "w_veh_reopt": 1.6,
                    "w_add_spl_regr": 0.2,
                    "step_non_reg": 0,
                    "eps_kappa": 1e-3,
                    "scaling": {"v_s": 10.0,
                                "omega_z_s": 5.0,
                                "n_s": 0.5,
                                "f_drive_s": 30.0,
                                "f_brake_s": 30.0,
                                "gamma_y_s": 10.0,
                                "omega_z_max": 15.0,
                                "v_guess": 3.0,
                                "f_prod_max": 1.0,
                                "f_reg_s": 30.0}}

### vehicle parameters (minimum lap time optimization)
# wheelbase_front:     [m] CoG -> front axle = 0.33 [repo] - 0.155 [guide: CoM x = 0.15532 m, assumed from rear axle]
# wheelbase_rear:      [m] CoG -> rear axle, 0.155 [guide]
# track_width_*:       [m] 0.236 [guide]
# cog_z:               [m] 0.074 [gym] (= wheel radius 0.059 + CoM z 0.014 [guide])
# I_z:                 [kgm^2] 0.0471 [gym] for 3.74 kg, scaled to 3.906 kg [est]
# liftcoeff_*:         [kg*m2/m3] no aero devices
# k_brake_front:       [-] 0.5 [est]
# k_drive_front:       [-] 0.5, all-wheel drive [guide], even split [est]
# k_roll:              [-] 0.5 [est]
# t_delta:             [s] delta_max / steering rate = 0.524 / 3.2 rad/s [guide]
# t_drive, t_brake:    [s] 0.05 [est]
# power_max:           [W] 500 [est]; traction limits acceleration below ~18 m/s anyway (mue * m * g ~ 27 N)
# f_drive_max:         [N] 40 [est], above the traction limit
# f_brake_max:         [N] 40 [est], above the traction limit
# delta_max:           [rad] 0.524 [repo, guide]

vehicle_params_mintime = {"wheelbase_front": 0.175,
                          "wheelbase_rear": 0.155,
                          "track_width_front": 0.236,
                          "track_width_rear": 0.236,
                          "cog_z": 0.074,
                          "I_z": 0.0492,
                          "liftcoeff_front": 0.0,
                          "liftcoeff_rear": 0.0,
                          "k_brake_front": 0.5,
                          "k_drive_front": 0.5,
                          "k_roll": 0.5,
                          "t_delta": 0.164,
                          "t_drive": 0.05,
                          "t_brake": 0.05,
                          "power_max": 500.0,
                          "f_drive_max": 40.0,
                          "f_brake_max": 40.0,
                          "delta_max": 0.524}

### tire parameters (minimum lap time optimization), simplified Pacejka, D = mue * F_z
# c_roll:      [-] 0.015 [est]
# f_z0:        [N] nominal wheel load = mass * g / 4
# B, C, E:     [-] [est] peak lateral force at ~0.2 rad slip, typical for 1/10 rubber tires; tune in sim
# eps:         [-] load sensitivity of D, TUM default

tire_params_mintime = {"c_roll": 0.015,
                       "f_z0": 9.58,
                       "B_front": 10.0,
                       "C_front": 1.6,
                       "eps_front": -0.1,
                       "E_front": 0.5,
                       "B_rear": 10.0,
                       "C_rear": 1.6,
                       "eps_rear": -0.1,
                       "E_rear": 0.5}

### powertrain behavior: off (TUM's thermal / battery model is for a full-size electric race car)

pwr_params_mintime = {"pwr_behavior": false}
